[project]
name = "visala-agentic-commerce"
version = "0.1.0"
description = "Agent-callable storefront for a real D2C food brand, on Razorpay test mode"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10,<2",
    "fastapi",
    "uvicorn",
    "razorpay",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "litellm",
    "httpx",
    "pyyaml",
    "python-dotenv",
    "python-multipart",
    "typing-extensions",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff==0.16.8"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
