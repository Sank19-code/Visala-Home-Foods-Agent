# LiteLLM proxy (gateway) config for the buyer agent — optional.
#   pip install "litellm[proxy]"
#   litellm --config litellm_config.yaml --port 4000
# then in .env:  LLM_API_BASE=http://localhost:4000   LLM_MODEL=buyer-agent   LLM_API_KEY=<master_key>
#
# The agent asks for "buyer-agent"; the gateway decides which Claude model serves it, retries,
# and falls back to a cheaper model when the primary is overloaded. Keys stay on the gateway.
model_list:
  - model_name: buyer-agent
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: buyer-agent-fallback
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

router_settings:
  num_retries: 2
  fallbacks:
    - buyer-agent: [buyer-agent-fallback]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
